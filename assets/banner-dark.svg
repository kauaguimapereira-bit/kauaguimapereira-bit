<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Building Tomorrow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="115%" r="70%">
      <stop offset="0" stop-color="#5B8DB8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B8DB8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- horizonte: arcos concêntricos -->
  <g fill="none" stroke="#C7D2E3" stroke-opacity="0.22" stroke-width="1">
    <circle cx="640" cy="640" r="360"/>
    <circle cx="640" cy="640" r="420"/>
    <circle cx="640" cy="640" r="480"/>
    <circle cx="640" cy="640" r="540"/>
  </g>

  <!-- texto -->
  <text x="640" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#8E8E93">SOFTWARE  ·  INTELIGÊNCIA ARTIFICIAL  ·  ENGENHARIA</text>
  <text x="640" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="10" fill="#F5F5F7">BUILDING TOMORROW</text>
  <rect x="540" y="222" width="200" height="2" rx="1" fill="url(#fade)"/>
  <text x="640" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="1.5" fill="#A1A1A6">Aprendendo, criando e construindo um futuro na tecnologia.</text>
</svg>
