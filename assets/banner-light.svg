<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Building Tomorrow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAFC"/>
      <stop offset="1" stop-color="#E6E9EF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="115%" r="70%">
      <stop offset="0" stop-color="#BFD9F2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#BFD9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lineclip"><rect x="540" y="221" width="200" height="4"/></clipPath>
  </defs>

  <style>
    .glow  { animation: breathe 7s ease-in-out infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: ripple 8s ease-in-out infinite; }
    .r2 { animation-delay: 1s; } .r3 { animation-delay: 2s; } .r4 { animation-delay: 3s; }
    .orbit { animation: spin 40s linear infinite; transform-origin: 640px 640px; }
    .title { animation: rise 1.4s cubic-bezier(.2,.7,.2,1) backwards; }
    .sub   { animation: rise 1.4s cubic-bezier(.2,.7,.2,1) .5s backwards; }
    .bar   { transform-box: fill-box; transform-origin: center; animation: grow 1.2s cubic-bezier(.2,.7,.2,1) .3s backwards; }
    .sweep { animation: sweep 4.5s ease-in-out 1.5s infinite; }
    .ph    { opacity: 0; animation: phrase 12s ease-in-out infinite; }
    .p0 { animation-delay: 0s; } .p1 { animation-delay: 3s; } .p2 { animation-delay: 6s; } .p3 { animation-delay: 9s; }
    .pt    { fill: #7FA6CC; opacity: 0; animation: float 12s ease-in-out infinite; }

    @keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes ripple  { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.025); opacity: .45; } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes rise    { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow    { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes sweep   { 0% { transform: translateX(-140px); } 60%,100% { transform: translateX(760px); } }
    @keyframes phrase  { 0% { opacity: 0; transform: translateY(8px); } 4%,21% { opacity: 1; transform: translateY(0); } 25%,100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes float   { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-90px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .p0 { opacity: 1; }
    }
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect class="glow" width="1280" height="360" fill="url(#glow)"/>

  <!-- horizonte: arcos que respiram -->
  <g fill="none" stroke="#8E9AAF" stroke-opacity="0.38" stroke-width="1">
    <circle class="ring r1" cx="640" cy="640" r="360"/>
    <circle class="ring r2" cx="640" cy="640" r="420"/>
    <circle class="ring r3" cx="640" cy="640" r="480"/>
    <circle class="ring r4" cx="640" cy="640" r="540"/>
  </g>
  <!-- arco azul em órbita lenta -->
  <circle class="orbit" cx="640" cy="640" r="360" fill="none" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="90 2171" stroke-linecap="round"/>

  <!-- partículas -->
  <g>
    <circle class="pt" cx="723" cy="238" r="1.6" style="animation-duration:9s;animation-delay:-5.2s"/>
    <circle class="pt" cx="1157" cy="224" r="1.6" style="animation-duration:11s;animation-delay:-4.7s"/>
    <circle class="pt" cx="136" cy="222" r="1.6" style="animation-duration:11s;animation-delay:-3.3s"/>
    <circle class="pt" cx="245" cy="341" r="1.6" style="animation-duration:9s;animation-delay:-0.5s"/>
    <circle class="pt" cx="517" cy="349" r="1.2" style="animation-duration:15s;animation-delay:-4.6s"/>
    <circle class="pt" cx="161" cy="256" r="1.2" style="animation-duration:11s;animation-delay:-4.5s"/>
    <circle class="pt" cx="653" cy="307" r="1.2" style="animation-duration:13s;animation-delay:-4.3s"/>
    <circle class="pt" cx="1207" cy="246" r="1.2" style="animation-duration:11s;animation-delay:-4.7s"/>
    <circle class="pt" cx="822" cy="224" r="2" style="animation-duration:9s;animation-delay:-5.7s"/>
    <circle class="pt" cx="481" cy="327" r="2" style="animation-duration:13s;animation-delay:-4.3s"/>
    <circle class="pt" cx="1013" cy="349" r="1.6" style="animation-duration:11s;animation-delay:-2.9s"/>
    <circle class="pt" cx="428" cy="262" r="1.2" style="animation-duration:15s;animation-delay:-4.6s"/>
    <circle class="pt" cx="763" cy="314" r="1.6" style="animation-duration:9s;animation-delay:-4.9s"/>
    <circle class="pt" cx="301" cy="331" r="1.6" style="animation-duration:13s;animation-delay:-1.3s"/>
  </g>

  <!-- texto -->
  <text class="ph p0" x="640" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#6E6E73">SOFTWARE</text>
  <text class="ph p1" x="640" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#6E6E73">INTELIGÊNCIA ARTIFICIAL</text>
  <text class="ph p2" x="640" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#6E6E73">ENGENHARIA DE SOFTWARE</text>
  <text class="ph p3" x="640" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#6E6E73">CARREIRA INTERNACIONAL</text>
  <text class="title" x="640" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="10" fill="#1D1D1F">BUILDING TOMORROW</text>
  <rect class="bar" x="540" y="222" width="200" height="2" rx="1" fill="url(#fade)"/>
  <g clip-path="url(#lineclip)"><rect class="sweep" x="540" y="221" width="120" height="4" fill="url(#shine)"/></g>
  <text class="sub" x="640" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="1.5" fill="#6E6E73">Aprendendo, criando e construindo um futuro na tecnologia.</text>
</svg>
