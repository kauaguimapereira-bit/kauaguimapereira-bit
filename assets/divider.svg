<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9AAF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8E9AAF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8E9AAF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <style>
    .mover { animation: move 9s ease-in-out infinite alternate; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes move  { from { transform: translateX(-420px); } to { transform: translateX(420px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.9); opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="11.5" width="1280" height="1" fill="url(#g)"/>
  <g class="mover">
    <rect x="540" y="11" width="100" height="2" fill="url(#trail)"/>
    <circle class="pulse" cx="640" cy="12" r="3" fill="#0A84FF" opacity=".35"/>
    <circle cx="640" cy="12" r="3" fill="#0A84FF"/>
  </g>
</svg>
